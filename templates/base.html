{% load static %}<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><title>{% block title %}Sunny Edu{% endblock %}</title><link rel="stylesheet" href="{% static 'css/app.css' %}?v=20261121v17"><link rel="stylesheet" href="{% static 'css/loading.css' %}?v=3"><script src="{% static 'js/loading.js' %}?v=4" defer></script><link rel="stylesheet" href="{% static 'css/dialog.css' %}?v=2"><script src="{% static 'js/dialog.js' %}?v=1" defer></script><link rel="stylesheet" href="{% static 'css/error-help.css' %}?v=2"><script src="{% static 'js/error-help.js' %}?v=4" defer></script>{% block head %}{% endblock %}<link rel="stylesheet" href="{% static 'css/inputs.css' %}?v=2"><script src="{% static 'js/inputs.js' %}?v=1" defer></script></head>
<body data-dialog-warning="{% static 'img/sunny-edu/Cham Than.png' %}?v=2" data-dialog-success="{% static 'img/sunny-edu/Tick.png' %}?v=2" class="{% block body_class %}{% endblock %}"><a class="skip" href="#main">Chuyển tới nội dung</a><div id="sunny-loading" class="sunny-loading" role="status" aria-label="Đang tải" aria-live="polite" hidden><div class="sunny-loading-card"><img src="{% static 'img/sunny-edu/logo-transparent.png' %}" alt=""></div></div>{% block shell %}{% endblock %}<button type="button" id="sunny-topup" class="sunny-topup" aria-label="Lên đầu trang" hidden><img src="{% static 'img/sunny-edu/topup.png' %}?v=1" alt=""></button>{% block scripts %}{% endblock %}{% block seasonal %}{% if seasonal_theme %}<link rel="stylesheet" href="{% static 'css/seasonal.css' %}?v=5"><div id="seasonal-decor" data-theme="{{ seasonal_theme }}" data-static-root="{% static 'img/seasonal/' %}" data-christmas-root="{% static 'img/sunny-edu/noel Image/' %}" data-teachers-day-root="{% static 'img/sunny-edu/20-11/' %}" aria-hidden="true"></div><script src="{% static 'js/seasonal.js' %}?v=5" defer></script>{% endif %}{% endblock %}</body></html>
