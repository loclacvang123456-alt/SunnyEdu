{% load static %}<header class="student-header"><div class="header-inner"><a class="brand" href="{{ student_home_url|default:'/student/' }}"><img class="sunny-logo" src="{% static 'img/sunny-edu/logo-transparent.png' %}" alt="" width="48" height="48"><span>Sunny Edu</span></a><nav class="student-nav" aria-label="Điều hướng chính"><a href="{{ student_home_url|default:'/student/' }}" {% if active == 'home' %}aria-current="page"{% endif %}>Bài tập</a><a href="/courses/" {% if active == 'courses' %}aria-current="page"{% endif %}>Khóa học</a><a href="/speaking/practice/" {% if active == 'speaking' %}aria-current="page"{% endif %}>Luyện nói</a>{% if results_url %}<a href="{{ results_url }}" {% if active == 'results' %}aria-current="page"{% endif %}>Kết quả</a>{% endif %}{% if errors_url %}<a href="{{ errors_url }}" {% if active == 'errors' %}aria-current="page"{% endif %}>Em cần ôn</a>{% endif %}{% if profile_url %}<a href="{{ profile_url }}" {% if active == 'profile' %}aria-current="page"{% endif %}>Hồ sơ</a>{% endif %}</nav><div class="account"><span>{{ request.user.display_name|default:request.user.username }}</span><form method="post" action="{{ logout_url|default:'/logout/' }}">{% csrf_token %}<button type="submit" class="text-button">Đăng xuất</button></form></div></div></header>
